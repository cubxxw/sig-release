# Sig Release Workflow Update Release Notes Draft

## Action

Follow the update-release-notes-draft workflow:
1. Add or update multiple YAML files under releases/release-<version>/release-notes/maps/ for each PR included in the release.
2. Regenerate or update releases/release-<version>/release-notes/release-notes-draft.json and release-notes-draft.md to reflect the latest changes.
3. Optionally update session files under releases/release-<version>/release-notes/sessions/ (e.g., when running automation tools).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: releases/release-*/release-notes/maps/pr-*-map.yaml, releases/release-*/release-notes/release-notes-draft.json, releases/release-*/release-notes/release-notes-draft.md

